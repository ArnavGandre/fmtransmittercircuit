<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FM transmitter on a breadboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --mat:#2b565b; --mat-ink:#ffffff; --panel:#eceeeb; --ink:#17212a; --muted:#56636b; --line:#c8cfcc;
  --chip:#ffffff; --accent:#f2b72e; --accent-ink:#1b1606; --hud:rgba(12,28,31,.72);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --mat:#1d3c40; --panel:#182024; --ink:#e6ebe8; --muted:#9aa7ad; --line:#2f3d3f; --chip:#212c31; }
}
:root[data-theme="dark"]{ --mat:#1d3c40; --panel:#182024; --ink:#e6ebe8; --muted:#9aa7ad; --line:#2f3d3f; --chip:#212c31; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--mat);color:var(--ink);font-family:Barlow,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 390px;height:100%}
.stage{position:relative;overflow:hidden;min-height:0;background:var(--mat)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;border:0;
  font:600 12.5px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;padding:4px 7px 3px;border-radius:3px;
  background:rgba(14,26,29,.8);color:#fff;white-space:nowrap}
.tag:hover{background:#0e1a1d}
.tag.sel{background:var(--accent);color:var(--accent-ink)}
.tag.dim{opacity:.35}
.hud{position:absolute;left:16px;top:14px;right:16px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 20px;pointer-events:none;color:var(--mat-ink)}
.hud > *{pointer-events:auto}
.title h1{font:700 30px/1 "Barlow Condensed",sans-serif;margin:0;letter-spacing:.005em}
.title p{margin:4px 0 0;font-size:14px;opacity:.82;max-width:44ch}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tool{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:4px;padding:6px 11px;cursor:pointer;font-weight:500;font-size:14px}
.tool:hover{background:rgba(255,255,255,.18)}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{position:absolute;left:16px;bottom:12px;color:#fff;opacity:.6;font-size:13px;pointer-events:none}
.buildbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(620px,calc(100% - 28px));background:var(--panel);color:var(--ink);
  border-radius:6px;padding:12px 14px;display:none;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.28)}
.buildbar.on{display:flex}
.buildbar .n{font:700 26px/1 "Barlow Condensed",sans-serif;min-width:3.2em;font-variant-numeric:tabular-nums}
.buildbar .n small{font-size:14px;font-weight:500;color:var(--muted)}
.buildbar .txt{flex:1;font-size:14px;line-height:1.35}
.buildbar .btns{display:flex;gap:6px}
.bb{border:1px solid var(--line);background:var(--chip);border-radius:4px;padding:6px 10px;cursor:pointer}
.bb.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.bb:disabled{opacity:.4;cursor:default}

aside{background:var(--panel);overflow-y:auto;border-left:1px solid var(--line);min-height:0}
.pane{padding:22px 24px 28px}
.pane h2{font:700 24px/1.1 "Barlow Condensed",sans-serif;margin:0 0 6px}
.pane h3{font:600 17px/1.2 "Barlow Condensed",sans-serif;margin:22px 0 6px;color:var(--ink)}
.pane p{margin:0 0 10px;max-width:62ch}
.lede{color:var(--muted)}
.group{margin-top:18px}
.group h3{margin:0 0 6px;font-size:16px;color:var(--muted);font-weight:600}
.plist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.plist button{display:grid;grid-template-columns:3.2em 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 4px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.plist button:hover{background:rgba(127,127,127,.09)}
.plist .id{font:700 17px/1 "Barlow Condensed",sans-serif}
.plist .k{color:var(--muted);font-size:13.5px}
.plist .v{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.sw{display:inline-flex;height:10px;border-radius:5px;overflow:hidden;background:#d8c29a;padding:0 3px;gap:2px;vertical-align:middle;margin-right:6px}
.sw i{width:4px;height:100%}
.checks{margin:0;padding-left:18px}
.checks li{margin-bottom:6px}
.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;margin-bottom:14px;font-size:14px}
.back:hover{color:var(--ink)}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.head .big{font:700 40px/1 "Barlow Condensed",sans-serif}
.head .val{font:600 22px/1 "Barlow Condensed",sans-serif}
.kind{color:var(--muted);margin:4px 0 8px}
.holes{display:flex;flex-direction:column;gap:6px;margin:4px 0 0;padding:0;list-style:none}
.holes li{background:var(--chip);border:1px solid var(--line);border-left-width:5px;border-radius:4px;padding:7px 10px;font-size:14px;line-height:1.35}
.holes b{font-variant-numeric:tabular-nums}
.holes span{color:var(--muted)}
.viva{background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-top:4px}
.legend{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.legend li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35}
.legend i{flex:0 0 14px;height:14px;border-radius:3px;margin-top:2px}
.legend span{color:var(--muted)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,56%) minmax(0,44%)}
  aside{border-left:0;border-top:1px solid var(--line)}
  .title h1{font-size:24px}
  .title p{display:none}
  .hint{display:none}
  .pane{padding:18px 18px 24px}
  .buildbar{flex-wrap:wrap}
  .buildbar .txt{flex-basis:100%;order:3}
}
@media (prefers-reduced-motion: reduce){ .tag{transition:none} }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div id="tags"></div>
    <div class="hud">
      <div class="title">
        <h1>FM transmitter, hole by hole</h1>
        <p>Art Swan's two-transistor transmitter laid out on a half-size breadboard. Click any part.</p>
      </div>
      <div class="tools" role="toolbar" aria-label="View options">
        <button class="tool" id="tLabels" aria-pressed="true">Labels</button>
        <button class="tool" id="tNets" aria-pressed="false">Show connections</button>
        <button class="tool" id="tBuild" aria-pressed="false">Build step by step</button>
        <button class="tool" id="tReset">Reset view</button>
      </div>
    </div>
    <div class="hint">Drag to orbit. Scroll or pinch to zoom. Right-drag to pan.</div>
    <div class="buildbar" id="buildbar" aria-live="polite">
      <div class="n" id="bbN"></div>
      <div class="txt" id="bbT"></div>
      <div class="btns">
        <button class="bb" id="bbPrev">Back</button>
        <button class="bb primary" id="bbNext">Next part</button>
        <button class="bb" id="bbExit">Done</button>
      </div>
    </div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);

/* ---------- board geometry: 1 unit = 1 hole pitch (2.54 mm) ---------- */
const ROWS={a:-5,b:-4,c:-3,d:-2,e:-1,f:1,g:2,h:3,i:4,j:5};
const RAILZ={"T+":-8,"T-":-7,"B-":7,"B+":8};
const COLS=30;
function P(h,y){
  y=y||0;
  let m=h.match(/^([TB][+-])(\d+)$/);
  if(m) return new THREE.Vector3(+m[2],y,RAILZ[m[1]]);
  m=h.match(/^([a-j])(\d+)$/);
  return new THREE.Vector3(+m[2],y,ROWS[m[1]]);
}
function stripKey(h){
  if(/^[TB][+-]/.test(h)) return h.slice(0,2);
  return ("abcde".includes(h[0])?"T":"B")+h.slice(1);
}
function holeName(h){
  const m=h.match(/^B([+-])(\d+)$/);
  if(m) return (m[1]==="+"?"+9 V rail":"ground rail")+", column "+m[2];
  return "hole "+h;
}

/* ---------- electrical nodes (each is one metal strip or rail) ---------- */
const NETS={
  "B+": {name:"+9 V rail",color:"#e23d35"},
  "B-": {name:"Ground rail",color:"#2f66d8"},
  "B10":{name:"Mic signal",color:"#a45ee0"},
  "B12":{name:"Q1 emitter",color:"#e58a1f"},
  "B14":{name:"Q1 base",color:"#e2508f"},
  "B16":{name:"Q1 collector (amplified audio)",color:"#3aa351"},
  "B18":{name:"Q2 emitter",color:"#1ba7b8"},
  "B20":{name:"Q2 base",color:"#c4a100"},
  "B22":{name:"Tank: Q2 collector, L1, C4, C5, antenna",color:"#8a6b52"}
};

/* ---------- parts ---------- */
const BANDC=["#171717","#6e3b1f","#c8262b","#e8761b","#e9c31c","#2e9a4a"];
const COMPS=[
 {id:"MIC",name:"Electret mic",value:"2-lead capsule",kind:"Microphone",stage:"audio",holes:["h10","B-8"],
  build:g=>buildMic(g),
  what:"Turns sound into a small voltage. Inside the can is a permanently charged diaphragm and a tiny FET amplifier, which is why it needs power through R1.",
  place:"Red lead (+) into h10. Black lead (−, the pad that connects to the metal case) into the ground rail at column 8.",
  spot:"Round metal can, 6 to 10 mm across, black felt on top. On the back, the pad with thin traces running to the case is negative.",
  viva:"An electret mic is a condenser mic with a built-in permanent charge and a JFET buffer. R1 is the drain load for that JFET.",
  watch:"Reversed polarity gives silence, not damage. If you hear nothing, flip the mic before anything else."},
 {id:"R1",name:"R1",value:"10 kΩ",kind:"Resistor, mic bias",stage:"audio",holes:["j10","B+10"],bands:[1,0,3],
  build:g=>resistor(g,"j10","B+10",[1,0,3],1.35),
  what:"Feeds the mic's internal FET from +9 V. Sound changes the FET's current, and that shows up as a changing voltage on column 10.",
  place:"j10 to the +9 V rail at column 10. It hops over the ground rail; only its two ends go into holes.",
  spot:"Bands brown, black, orange, gold.",
  viva:"Load resistor for the electret's JFET. Values between 2.2 kΩ and 10 kΩ are typical.",
  watch:"The body passes over the ground rail. Make sure the lead doesn't brush into a ground hole on the way."},
 {id:"C1",name:"C1",value:"0.1 µF",kind:"Ceramic capacitor, coupling",stage:"audio",holes:["g10","g14"],
  build:g=>disc(g,"g10","g14",1.6,0.58,"#c9772c","104"),
  what:"Passes the audio from the mic to Q1 while blocking DC, so the mic's bias voltage and Q1's bias voltage don't disturb each other.",
  place:"g10 to g14, arching over column 12 without touching it.",
  spot:"Small ceramic disc printed 104 (10 × 10⁴ pF = 0.1 µF). No polarity.",
  viva:"Coupling capacitor. Its reactance is about 1.6 kΩ at 1 kHz and infinite at DC, so audio passes and DC doesn't.",
  watch:"Column 12 between its legs belongs to Q1's emitter. C1 must not plug in there."},
 {id:"R2",name:"R2",value:"1 MΩ",kind:"Resistor, Q1 base bias (upper)",stage:"audio",holes:["i14","B+13"],bands:[1,0,5],
  build:g=>resistor(g,"i14","B+13",[1,0,5],2.0),
  what:"Feeds a small current from +9 V into Q1's base. With R3 it parks the base near 0.7 to 0.8 V, where Q1 amplifies instead of sitting fully on or fully off.",
  place:"i14 to the +9 V rail at column 13. It rides above R3, angled one column to the left.",
  spot:"Bands brown, black, green, gold.",
  viva:"Voltage-divider bias: 9 V × 100k / (1M + 100k) ≈ 0.82 V before the base loads it.",
  watch:"Swapping R2 and R3 puts about 8 V on the base and saturates Q1. The carrier still appears but carries no audio."},
 {id:"R3",name:"R3",value:"100 kΩ",kind:"Resistor, Q1 base bias (lower)",stage:"audio",holes:["j14","B-14"],bands:[1,0,4],
  build:g=>resistor(g,"j14","B-14",[1,0,4],0.9),
  what:"The lower half of the bias divider. It pulls Q1's base toward ground so R2 can't push it too high.",
  place:"j14 to the ground rail at column 14. Keep it low so R2 can pass over it.",
  spot:"Bands brown, black, yellow, gold.",
  viva:"Together with R2 it forms the base bias divider.",
  watch:"Brown-black-yellow (100 kΩ) and brown-black-orange (10 kΩ) look alike under yellow light. Check with a meter."},
 {id:"Q1",name:"Q1",value:"2N3904",kind:"NPN transistor, audio preamp",stage:"audio",holes:["f12","f14","f16"],
  build:g=>to92(g,["f12","f14","f16"]),
  what:"Amplifies the mic's few millivolts into a signal big enough to swing the oscillator's frequency. It's a common-emitter amplifier.",
  place:"Flat face toward you. Emitter in f12, base in f14, collector in f16. Spread the legs so each gets its own column; the body leans over the centre channel.",
  spot:"Black half-round TO-92 package printed 2N3904. Flat face toward you, legs down: E, B, C from left to right.",
  viva:"Common-emitter amplifier. Voltage gain is roughly R4 divided by (R5 plus the transistor's internal emitter resistance), so a few tens.",
  watch:"A BC547 or BC548 is a common swap in India, but its pins run C, B, E. If you use one, turn it around so collector still lands in column 16."},
 {id:"R4",name:"R4",value:"10 kΩ",kind:"Resistor, Q1 collector load",stage:"audio",holes:["j16","B+16"],bands:[1,0,3],
  build:g=>resistor(g,"j16","B+16",[1,0,3],1.2),
  what:"Collector load for Q1. The amplified audio appears as a voltage swing across it, with the collector sitting a couple of volts below 9 V.",
  place:"j16 to the +9 V rail at column 16.",
  spot:"Bands brown, black, orange, gold.",
  viva:"The load resistor that converts Q1's changing collector current into a changing voltage.",
  watch:"Measure column 16 with a meter once powered. Near 9 V means Q1 is off; near 0 V means it's saturated."},
 {id:"R5",name:"R5",value:"100 Ω",kind:"Resistor, Q1 emitter",stage:"audio",holes:["j12","B-12"],bands:[1,0,1],
  build:g=>resistor(g,"j12","B-12",[1,0,1],0.9),
  what:"Adds negative feedback so Q1's gain is predictable and its bias stays put as it warms up.",
  place:"j12 to the ground rail at column 12.",
  spot:"Bands brown, black, brown, gold.",
  viva:"Emitter degeneration: it trades some gain for stability and lower distortion.",
  watch:"Easy to confuse with R7. 100 Ω is brown-black-brown; 1 kΩ is brown-black-red."},
 {id:"C2",name:"C2",value:"0.1 µF",kind:"Ceramic capacitor, coupling",stage:"rf",holes:["g16","g20"],
  build:g=>disc(g,"g16","g20",1.6,0.58,"#c9772c","104"),
  what:"Carries Q1's amplified audio to Q2's base and blocks DC, so each transistor keeps its own bias.",
  place:"g16 to g20, arching over column 18.",
  spot:"Ceramic disc printed 104. No polarity.",
  viva:"Interstage coupling capacitor between the audio amplifier and the oscillator.",
  watch:"Column 18 under it is Q2's emitter. C2 must not touch it."},
 {id:"R6",name:"R6",value:"10 kΩ",kind:"Resistor, Q2 base bias",stage:"rf",holes:["j20","B+20"],bands:[1,0,3],
  build:g=>resistor(g,"j20","B+20",[1,0,3],1.2),
  what:"Supplies Q2's base current from +9 V. Without it Q2 has no bias and won't oscillate.",
  place:"j20 to the +9 V rail at column 20.",
  spot:"Bands brown, black, orange, gold.",
  viva:"DC bias path for the oscillator transistor's base.",
  watch:"Leave room: C3 lands right next to it at i20."},
 {id:"C3",name:"C3",value:"0.01 µF",kind:"Ceramic capacitor, RF bypass",stage:"rf",holes:["i20","B+19"],
  build:g=>disc(g,"i20","B+19",2.1,0.5,"#c9772c","103"),
  what:"At 100 MHz this capacitor is almost a short (about 0.16 Ω). It ties Q2's base to the +9 V rail, which the battery turns into an AC ground, so Q2 works as a common-base stage that oscillates easily at VHF.",
  place:"i20 to the +9 V rail at column 19.",
  spot:"Ceramic disc printed 103 (10 × 10³ pF).",
  viva:"RF bypass capacitor. It grounds Q2's base for RF, making the oscillator common-base.",
  watch:"Keep its legs as short as you can. Long leads add inductance and weaken the bypass."},
 {id:"Q2",name:"Q2",value:"2N3904",kind:"NPN transistor, RF oscillator",stage:"rf",holes:["f18","f20","f22"],
  build:g=>to92(g,["f18","f20","f22"]),
  what:"The oscillator. With L1 and C4 it rings at roughly 88 to 108 MHz, and C5 feeds some of that back to keep it going. The audio at its base changes the transistor's internal capacitance, which nudges the frequency up and down. That is the frequency modulation.",
  place:"Flat face toward you. Emitter in f18, base in f20, collector in f22.",
  spot:"Same part as Q1: TO-92, printed 2N3904, E B C from left to right.",
  viva:"A Colpitts-style oscillator in common-base configuration. Modulation works because the junction capacitance varies with the audio voltage, like a varactor.",
  watch:"Same BC547 warning as Q1: check the pinout of the part you actually have."},
 {id:"R7",name:"R7",value:"1 kΩ",kind:"Resistor, Q2 emitter",stage:"rf",holes:["j18","B-18"],bands:[1,0,2],
  build:g=>resistor(g,"j18","B-18",[1,0,2],0.9),
  what:"Sets Q2's current to a few milliamps and gives the emitter a DC path to ground, while leaving the emitter free to carry the RF that C5 feeds back.",
  place:"j18 to the ground rail at column 18.",
  spot:"Bands brown, black, red, gold.",
  viva:"Emitter resistor that sets the oscillator's bias current.",
  watch:"Brown-black-red here, not brown-black-brown (that's R5)."},
 {id:"C5",name:"C5",value:"4.7 pF",kind:"Ceramic capacitor, feedback",stage:"rf",holes:["h18","h22"],
  build:g=>disc(g,"h18","h22",1.35,0.4,"#d6a64a","4p7"),
  what:"Feeds a little of the collector's RF back into the emitter in phase, which keeps the oscillation going.",
  place:"h18 to h22, arching in front of Q2.",
  spot:"Tiny ceramic marked 4.7, 4R7 or 4p7. Don't mix it up with a 47 pF part marked 47.",
  viva:"The feedback capacitor of the Colpitts-style oscillator. With Q2's internal capacitance it forms the capacitive divider.",
  watch:"Too large and the output gets unstable and full of harmonics. Too small and it won't start."},
 {id:"L1",name:"L1",value:"0.1 µH",kind:"Air-core coil, tank inductor",stage:"rf",holes:["j22","B+22"],
  build:g=>buildCoil(g),
  what:"With C4 it forms the tank circuit that sets the carrier frequency. You wind it yourself: about 5 turns of 22 AWG enamelled copper around a 6 mm former (a pen refill works), slid off and stretched to 6 to 8 mm long.",
  place:"j22 to the +9 V rail at column 22. Scrape the enamel off both ends first.",
  spot:"A small springy copper coil.",
  viva:"Tank inductor. Squeezing the turns together raises inductance and lowers the frequency; stretching them does the opposite.",
  watch:"Unscraped enamel means no contact and no oscillation. Tin the ends with solder if you can."},
 {id:"C4",name:"C4",value:"4–40 pF",kind:"Trimmer capacitor, tuning",stage:"rf",holes:["i22","B+25"],
  build:g=>buildTrimmer(g),
  what:"Tunes the transmit frequency. f = 1 / (2π√(LC)); with 0.1 µH, landing on 100 MHz needs about 25 pF in total, counting the trimmer plus stray and transistor capacitance.",
  place:"i22 to the +9 V rail at column 25.",
  spot:"Small plastic or ceramic body with a slotted rotor on top.",
  viva:"Variable capacitor in the tank circuit; it sets the carrier frequency.",
  watch:"Use a plastic tuning tool. A metal screwdriver, or even your hand nearby, shifts the frequency. That's normal at 100 MHz."},
 {id:"ANT",name:"Antenna",value:"20–25 cm",kind:"Solid hookup wire",stage:"rf",holes:["g22"],
  build:g=>buildAntenna(g),
  what:"Radiates the RF from the tank circuit. The model shows it shortened.",
  place:"g22, the same strip as Q2's collector.",
  spot:"Any solid-core hookup wire, 8 to 10 inches long.",
  viva:"A quarter wave at 100 MHz is about 75 cm. A 20 to 25 cm wire is deliberately short, which keeps the range to a room or two and the loading on the oscillator light.",
  watch:"Keep it straight and clear of the other parts. A longer antenna isn't the goal; a small range keeps this a harmless demo."},
 {id:"BAT",name:"Battery",value:"9 V",kind:"Power",stage:"power",holes:["B+2","B-3"],
  build:g=>buildBattery(g),
  what:"Powers the whole circuit, which draws roughly 10 mA.",
  place:"Red clip lead into the +9 V rail (outer row, red line) at column 2. Black lead into the ground rail (inner row, blue line) at column 3.",
  spot:"Standard 9 V battery with a snap clip.",
  viva:"The battery also acts as the AC ground that C3 and L1 return to.",
  watch:"Connect it last, after checking every strip once more. Use a fresh one: the frequency drifts as the voltage sags."}
];
const BUILD_ORDER=["Q1","R5","R3","R2","R4","R1","MIC","C1","Q2","R7","R6","C3","C2","C5","L1","C4","ANT","BAT"];
const byId={}; COMPS.forEach(c=>byId[c.id]=c);

/* ---------- three.js setup ---------- */
let scene,camera,renderer,controls,raycaster,pointer,stage;
const Y=new THREE.Vector3(0,1,0);
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function mat(color,o){return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.55,metalness:0},o||{}));}
function leadMat(){return mat("#b9bdc2",{metalness:.85,roughness:.32});}
function rod(a,b,r,m){
  const d=new THREE.Vector3().subVectors(b,a);const L=d.length();
  const me=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,8),m);
  me.position.copy(a).addScaledVector(d,.5);
  me.quaternion.setFromUnitVectors(Y,d.normalize());
  return me;
}
function poly(g,pts,r,m){
  for(let i=0;i<pts.length-1;i++) g.add(rod(pts[i],pts[i+1],r,m));

function to92(g,hs){

/* ---------- breadboard ---------- */
function boardTexture(){
  const s=64,X0=-1.5,X1=32.5,Z0=-9.5,Z1=9.5,W=(X1-X0)*s,H=(Z1-Z0)*s;
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const px=v=>(v-X0)*s,pz=v=>(v-Z0)*s;
  x.fillStyle="#f1f1ec";x.fillRect(0,0,W,H);
  x.fillStyle="#dcdcd4";x.fillRect(0,pz(-.42),W,.84*s);
  x.fillStyle="#cfcfc6";x.fillRect(0,pz(-.06),W,.12*s);
  const line=(z,col)=>{x.fillStyle=col;x.fillRect(px(.4),pz(z)-3,px(30.6)-px(.4),6);};
  line(-8.72,"#d8403a");line(-6.28,"#3565cf");line(6.28,"#3565cf");line(8.72,"#d8403a");
  const hole=(cx,cz)=>{const hs=.23*s;x.fillStyle="#c9c9c1";x.fillRect(px(cx)-hs-2,pz(cz)-hs-2,hs*2+4,hs*2+4);
    x.fillStyle="#2c2c2c";x.fillRect(px(cx)-hs,pz(cz)-hs,hs*2,hs*2);};
  for(let col=1;col<=COLS;col++){Object.values(ROWS).forEach(z=>hole(col,z));[-8,-7,7,8].forEach(z=>hole(col,z));}
  x.fillStyle="#7c7c76";x.textAlign="center";x.textBaseline="middle";x.font="600 30px 'Barlow Condensed', sans-serif";
  Object.entries(ROWS).forEach(([k,z])=>{x.fillText(k,px(-.45),pz(z));x.fillText(k,px(31.45),pz(z));});
  [1,5,10,15,20,25,30].forEach(n=>{x.fillText(String(n),px(n),pz(-5.85));x.fillText(String(n),px(n),pz(5.85));});
  x.font="700 40px 'Barlow Condensed', sans-serif";
  [[-8,"+","#d8403a"],[-7,"−","#3565cf"],[7,"−","#3565cf"],[8,"+","#d8403a"]].forEach(([z,t,col])=>{
    x.fillStyle=col;x.fillText(t,px(-.45),pz(z));x.fillText(t,px(31.45),pz(z));});
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;
}
function buildBoard(){
  const side=mat("#e4e4dd",{roughness:.7});
  const top=new THREE.MeshStandardMaterial({map:boardTexture(),roughness:.75});
  const b=new THREE.Mesh(new THREE.BoxGeometry(34,1,19),[side,side,top,side,side,side]);
  b.position.set(15.5,-.5,0);b.receiveShadow=true;scene.add(b);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),mat(cssVar("--mat")||"#2b565b",{roughness:1}));
  ground.rotation.x=-Math.PI/2;ground.position.y=-1;ground.receiveShadow=true;scene.add(ground);
}

/* ---------- strips (the metal clips under the holes) ---------- */
const strips={};
function stripMesh(key){
  if(strips[key]) return strips[key];
  let w,d,cx,cz;
  if(key.length===2&&/[+-]/.test(key[1])){w=29.8;d=.62;cx=15.5;cz=RAILZ[key];}
  else{const col=+key.slice(1);w=.66;d=4.84;cx=col;cz=key[0]==="T"?-3:3;}
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({color:"#fff",transparent:true,opacity:.45,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.position.set(cx,.012,cz);m.visible=false;m.renderOrder=1;scene.add(m);
  strips[key]=m;return m;
}
const rings=[];
function setRings(holes){
  rings.forEach(r=>r.visible=false);
  holes.forEach((h,i)=>{
    if(!rings[i]){const r=new THREE.Mesh(new THREE.RingGeometry(.3,.46,28),new THREE.MeshBasicMaterial({color:"#f2b72e",depthWrite:false,transparent:true}));
      r.rotation.x=-Math.PI/2;r.renderOrder=2;scene.add(r);rings[i]=r;}
    rings[i].position.copy(P(h,.02));rings[i].visible=true;
  });
}

/* ---------- state ---------- */
const state={sel:null,labels:true,nets:false,build:false,step:0};
const tagEls={};

function init(){
  stage=$("#stage");
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);
  scene=new THREE.Scene();
  const matCol=cssVar("--mat")||"#2b565b";
  scene.background=new THREE.Color(matCol);scene.fog=new THREE.Fog(matCol,90,190);
  camera=new THREE.PerspectiveCamera(38,1,.1,600);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=8;controls.maxDistance=120;

  scene.add(new THREE.HemisphereLight(0xffffff,0x30464a,.75));
  const sun=new THREE.DirectionalLight(0xffffff,.85);sun.position.set(-18,40,26);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-30,right:40,top:30,bottom:-30,near:1,far:120});
  sun.shadow.bias=-.0005;sun.target.position.set(10,0,0);scene.add(sun);scene.add(sun.target);

  buildBoard();
  COMPS.forEach(c=>{
    const g=new THREE.Group();g.userData.cid=c.id;c.anchor=c.build(g);
    g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.userData.cid=c.id;}});
    scene.add(g);c.group=g;
    c.holes.forEach(h=>stripMesh(stripKey(h)));
    const t=document.createElement("button");t.className="tag";t.type="button";
    t.textContent=c.id==="ANT"||c.id==="BAT"||c.id==="MIC"?c.name:c.id+"  "+c.value;
    t.addEventListener("click",e=>{e.stopPropagation();select(c.id);});
    $("#tags").appendChild(t);tagEls[c.id]=t;
  });

  raycaster=new THREE.Raycaster();pointer=new THREE.Vector2();
  let down=null;
  renderer.domElement.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY};});
  renderer.domElement.addEventListener("pointerup",e=>{
    if(!down) return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;
    if(moved>5) return;
    const id=pick(e);
    if(id) select(id); else if(!state.build) select(null);
  });
  renderer.domElement.addEventListener("pointermove",e=>{renderer.domElement.style.cursor=pick(e)?"pointer":"";});
  window.addEventListener("keydown",e=>{if(e.key==="Escape"&&!state.build) select(null);});

  $("#tLabels").onclick=()=>{state.labels=!state.labels;$("#tLabels").setAttribute("aria-pressed",state.labels);};
  $("#tNets").onclick=()=>{state.nets=!state.nets;$("#tNets").setAttribute("aria-pressed",state.nets);refresh();};
  $("#tBuild").onclick=()=>{state.build?exitBuild():enterBuild();};
  $("#tReset").onclick=resetView;
  $("#bbPrev").onclick=()=>goStep(state.step-1);
  $("#bbNext").onclick=()=>goStep(state.step+1);
  $("#bbExit").onclick=exitBuild;

  new ResizeObserver(resize).observe(stage);resize();resetView();
  renderPanel();refresh();
  animate();
}

function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h) return;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
function resetView(){
  const a=camera.aspect||1.5;const k=a<1.1?1.9:a<1.5?1.35:1;
  controls.target.set(9,0,3);
  camera.position.set(9+2*k,26*k,34*k);controls.update();
}
function pick(e){
  const r=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const roots=COMPS.filter(c=>c.group.visible).map(c=>c.group);
  const hit=raycaster.intersectObjects(roots,true)[0];
  return hit?hit.object.userData.cid:null;
}

/* ---------- selection + highlighting ---------- */
function setGlow(c,on){
  c.group.traverse(o=>{if(o.isMesh&&o.material&&o.material.emissive){o.material.emissive.setHex(on?0x6a4800:0x000000);}});
}
function select(id){
  if(state.sel) setGlow(byId[state.sel],false);
  state.sel=id;
  if(id) setGlow(byId[id],true);
  refresh();renderPanel();
}
function refresh(){
  const visibleIds=state.build?BUILD_ORDER.slice(0,state.step+1):COMPS.map(c=>c.id);
  COMPS.forEach(c=>c.group.visible=visibleIds.includes(c.id));
  Object.values(strips).forEach(s=>s.visible=false);
  if(state.nets){
    COMPS.filter(c=>c.group.visible).forEach(c=>c.holes.forEach(h=>{const k=stripKey(h),s=strips[k];
      s.visible=true;s.material.color.set(NETS[k].color);s.material.opacity=.42;}));
  }
  if(state.sel){
    const c=byId[state.sel];
    c.holes.forEach(h=>{const k=stripKey(h),s=strips[k];s.visible=true;s.material.color.set(NETS[k].color);s.material.opacity=.7;});
    setRings(c.holes);
  } else setRings([]);
}

/* ---------- panel ---------- */
function swatch(c){
  if(!c.bands) return "";
  return '<span class="sw" aria-hidden="true">'+c.bands.map(d=>'<i style="background:'+BANDC[d]+'"></i>').join("")+'<i style="background:#c9a24a"></i></span>';
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function renderPanel(){
  const p=$("#panel");
  if(state.sel){p.innerHTML=detailHTML(byId[state.sel]);const b=p.querySelector(".back");if(b)b.onclick=()=>select(null);p.scrollTop=0;
    p.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>select(el.dataset.id));return;}
  const groups=[["audio","Audio stage: mic and Q1"],["rf","RF oscillator: Q2 and tank"],["power","Power"]];
  let h='<div class="pane"><h2>Parts</h2><p class="lede">Everything sits in the lower half of the board and the lower pair of rails. The top half stays empty. Pick a part to see where each leg goes and what it does.</p>';
  groups.forEach(([k,label])=>{
    h+='<div class="group"><h3>'+label+'</h3><ul class="plist">';
    COMPS.filter(c=>c.stage===k).forEach(c=>{
      h+='<li><button data-id="'+c.id+'"><span class="id">'+esc(c.id==="ANT"?"ANT":c.id)+'</span><span class="k">'+esc(c.kind)+'</span><span class="v">'+swatch(c)+esc(c.value)+'</span></button></li>';
    });
    h+='</ul></div>';
  });
  if(state.nets){
    h+='<h3>Connections</h3><p>Each coloured bar is one metal strip under the board. Every leg on the same bar is joined.</p><ul class="legend">';
    Object.entries(NETS).forEach(([k,n])=>{
      const who=COMPS.filter(c=>c.holes.some(x=>stripKey(x)===k)).map(c=>c.id==="ANT"?"antenna":c.id==="BAT"?"battery":c.id==="MIC"?"mic":c.id);
      h+='<li><i style="background:'+n.color+'"></i><div><b>'+esc(n.name)+'</b><br><span>'+esc(who.join(", "))+'</span></div></li>';
    });
    h+='</ul>';
  }
  h+='<h3>Before you power it up</h3><ol class="checks">'+
     '<li>Go column by column against the connections view. One leg in the wrong strip is the usual reason it stays silent.</li>'+
     '<li>Tune an FM radio to an empty spot between 88 and 108 MHz, then connect the battery.</li>'+
     '<li>Turn C4 slowly with a plastic tool until you hear the room through the radio. A howl when the radio is close is feedback, which proves it works.</li>'+
     '<li>Breadboards add stray capacitance, so the frequency drifts more than on a soldered board. For the exhibition, consider soldering the RF half onto perfboard.</li></ol>';
  h+='</div>';
  p.innerHTML=h;
  p.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>select(el.dataset.id));
}
function detailHTML(c){
  const legNames=c.id==="Q1"||c.id==="Q2"?["Emitter","Base","Collector"]:c.id==="MIC"?["+ lead","− lead"]:c.id==="BAT"?["Red lead","Black lead"]:null;
  let holes=c.holes.map((h,i)=>{
    const k=stripKey(h),n=NETS[k];
    const others=COMPS.filter(o=>o.id!==c.id&&o.holes.some(x=>stripKey(x)===k)).map(o=>o.id==="ANT"?"antenna":o.id==="BAT"?"battery":o.id==="MIC"?"mic":o.id);
    return '<li style="border-left-color:'+n.color+'">'+(legNames?'<b>'+legNames[i]+'</b>: ':'')+'<b>'+esc(holeName(h))+'</b><br><span>'+esc(n.name)+(others.length?'. Shared with '+esc(others.join(", ")):'')+'</span></li>';
  }).join("");
  return '<div class="pane">'+(state.build?'':'<button class="back">All parts</button>')+
   '<div class="head"><span class="big">'+esc(c.id==="ANT"?"Antenna":c.id==="BAT"?"Battery":c.id==="MIC"?"Mic":c.id)+'</span><span class="val">'+swatch(c)+esc(c.value)+'</span></div>'+
   '<p class="kind">'+esc(c.kind)+'</p>'+
   '<p>'+esc(c.what)+'</p>'+
   '<h3>Where it goes</h3><p>'+esc(c.place)+'</p><ul class="holes">'+holes+'</ul>'+
   '<h3>How to spot it</h3><p>'+esc(c.spot)+'</p>'+
   '<h3>For the viva</h3><div class="viva">'+esc(c.viva)+'</div>'+
   '<h3>Watch out</h3><p>'+esc(c.watch)+'</p></div>';
}

/* ---------- build mode ---------- */
function enterBuild(){state.build=true;$("#tBuild").setAttribute("aria-pressed","true");$("#buildbar").classList.add("on");goStep(0);}
function exitBuild(){state.build=false;$("#tBuild").setAttribute("aria-pressed","false");$("#buildbar").classList.remove("on");select(null);}
function goStep(n){
  n=Math.max(0,Math.min(BUILD_ORDER.length-1,n));state.step=n;
  const c=byId[BUILD_ORDER[n]];
  $("#bbN").innerHTML=(n+1)+'<small> / '+BUILD_ORDER.length+'</small>';
  $("#bbT").textContent=(c.id==="ANT"?"Antenna":c.id==="BAT"?"Battery":c.id==="MIC"?"Mic":c.id)+" ("+c.value+"): "+c.place;
  $("#bbPrev").disabled=n===0;
  $("#bbNext").disabled=n===BUILD_ORDER.length-1;
  select(c.id);
}

/* ---------- labels + loop ---------- */
const v=new THREE.Vector3();
function updateTags(){
  const w=stage.clientWidth,h=stage.clientHeight;
  COMPS.forEach(c=>{
    const t=tagEls[c.id];
    if(!state.labels||!c.group.visible){t.style.display="none";return;}
    v.copy(c.anchor).project(camera);
    if(v.z>1){t.style.display="none";return;}
    t.style.display="";
    t.style.transform="translate("+((v.x*.5+.5)*w)+"px,"+((-v.y*.5+.5)*h)+"px) translate(-50%,-100%)";
    t.classList.toggle("sel",state.sel===c.id);
    t.classList.toggle("dim",!!state.sel&&state.sel!==c.id);
  });
}
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  const s=1+.12*Math.sin(performance.now()/260);
  rings.forEach(r=>{if(r.visible) r.scale.set(s,s,s);});
  renderer.render(scene,camera);updateTags();
}

function start(){ if(!window.THREE||!THREE.OrbitControls){$("#panel").innerHTML='<div class="pane"><h2>3D view could not load</h2><p>The three.js library failed to download. Check your connection and reload the page.</p></div>';return;} init(); }
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load("600 20px 'Barlow Condensed'"),document.fonts.load("500 20px 'Barlow Condensed'")]).catch(()=>{}).then(start);
} else start();
})();
</script>
